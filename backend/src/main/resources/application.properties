spring.application.name=auto-lancamentos-backend

# PostgreSQL
# Em produção (Render/Neon), define DB_URL/DB_USERNAME/DB_PASSWORD como variáveis
# de ambiente reais — os valores depois de ":" são só o fallback para desenvolvimento
# local, para não seres obrigado a configurar nada só para correr o projeto aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/automacao_contabilistica}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Em produção, JWT_SECRET tem de ser definida como variável de ambiente própria
# (chave diferente da usada em desenvolvimento).
jwt.secret=${JWT_SECRET:umaChaveSecretaBastanteLongaComPeloMenos32Bytes1234567890}
jwt.expiration=864000

# Nota: esta propriedade só é usada pela segurança automática do Spring Boot,
# que o SecurityConfig.java já substitui por completo (JWT). Fica sem efeito
# prático hoje — mantém-se parametrizada por segurança, mas é candidata a
# remover depois de confirmares que não é preciso.
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:123456}

fastapi.services.url=${FASTAPI_SERVICES_URL:http://localhost:8000/api/v1}

# Sem isto, o Spring Boot usa o limite por omissão de 1MB por ficheiro
# (413 Payload Too Large) — pequeno demais para uma fatura fotografada/
# digitalizada real. Alinhado com MAX_UPLOAD_SIZE (10MB) já declarado em
# fastapi/app/config/settings.py, para os dois lados aceitarem o mesmo
# tamanho máximo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Em produção (Render), a plataforma injeta a porta real via a variável PORT.
server.port=${PORT:8080}

# Origem permitida para CORS (ver CorsConfig.java) — em produção, define
# ALLOWED_ORIGIN com o URL público do frontend.
allowed.origin=${ALLOWED_ORIGIN:http://localhost:5173}

